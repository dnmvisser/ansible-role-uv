---
- name: Include installation tasks
  ansible.builtin.include_tasks:
    file: install.yml
  when: uv_install

- name: Include task files
  ansible.builtin.include_tasks:
    file: venv.yml
  loop: "{{ _uv_venvs }}"
  loop_control:
    loop_var: venv
    label: "{{ venv.path }}"
  vars:
    req_file: "{{ venv.path }}/requirements"
    req_checksum: "{{ venv.requirements | trim | hash('sha256') }}"

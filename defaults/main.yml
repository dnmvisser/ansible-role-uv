---
# Whether to install uv
uv_install: true

# What version to install. See https://github.com/astral-sh/uv/releases.
# This is only relevant when uv_install is true.
uv_version: latest

# The directory where the uv binaries should be put
uv_dir: /usr/local/bin

# The uv that we should use. Default to the binary in the uv_dir
# if we installed it. Otherwise, whatever is in $PATH.
# Override this if needed.
uv_bin_path: "{{ uv_dir ~ '/uv' if uv_install else 'uv' }}"

# List of virtual environments to set up.
# Each venv must have at least a path.
# uv_venvs:
#   - path: /opt/my_venv
#     state: installed
#     requirements: |
#       certbot==5.6.0
#     python: 3.14.2
#     python_preference: only-managed
uv_venvs: []

# venv defaults
_uv_venv_defaults:
  state: installed
  environment:
    UV_PYTHON: python3
    UV_PYTHON_PREFERENCE: only-system
    UV_PYTHON_DOWNLOADS: automatic

# This is the merged variable that will be used for the actual
# venv configurations. This should generally not be changed.
_uv_venvs: >-
  {{
    uv_venvs
    | map('combine', _uv_venv_defaults, recursive=True)
    | zip(uv_venvs)
    | map('combine', recursive=True)
  }}

# For safety checks
_unsupported_states: "{{ _uv_venvs | rejectattr('state', 'in', uv_venv_states) }}"

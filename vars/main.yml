---
_uv_version_path: "{{ 'latest/download' if uv_version == 'latest' else 'download/' ~ uv_version }}"
_uv_system_map:
  Linux: unknown-linux-gnu
  Darwin: apple-darwin
# TODO intel based macs? is anyone still using those?
_uv_arch: "{{ 'aarch64' if ansible_facts['architecture'] == 'arm64' else ansible_facts['architecture'] }}"
uv_latest_version_api_url: https://api.github.com/repos/astral-sh/uv/releases/latest
uv_release_url: "https://github.com/astral-sh/uv/releases/{{ _uv_version_path }}/uv-{{ _uv_arch }}-{{ _uv_system_map[ansible_facts['system']] }}.tar.gz"

# These are the supported venv states
uv_venv_states:
  - installed
  - reinstalled
  - synced
  - upgraded
